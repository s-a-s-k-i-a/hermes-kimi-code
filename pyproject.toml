[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-kimi-code"
version = "0.1.0"
description = "Delegate-only Kimi Code ACP plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Saskia Teichmann", email = "s-a-s-k-i-a@users.noreply.github.com" },
]
keywords = ["hermes-agent", "kimi-code", "acp", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Issues = "https://github.com/s-a-s-k-i-a/hermes-agent/issues/47"
Source = "https://github.com/s-a-s-k-i-a/hermes-kimi-code"

[project.entry-points."hermes_agent.plugins"]
kimi-code-delegate = "hermes_kimi_code"

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
